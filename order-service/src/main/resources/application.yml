spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    function:
      definition: inventoryEvents
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        bindings:
          inventoryEvents-in-0:
            consumer:
              startOffset: earliest
      bindings:
        inventoryEvents-in-0:
          destination: inventory-events
          group: order-service
        orderEvents-out-0:
          destination: order-events

shipping-service:
  base-url: http://localhost:8083

product-service:
  base-url: http://localhost:8082

customer-service:
  base-url: http://localhost:8084

groq:
  api-key: ${GROQ_API_KEY:gsk_placeholder_replace_with_real_key_0000000000}
  base-url: https://api.groq.com/openai/v1
  model-name: llama-3.1-8b-instant

server:
  port: 8081

logging:
  level:
    com.ecommerce.order: DEBUG
